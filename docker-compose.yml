services:
  # ----------------------------------------------------------------------
  # App / PHP-FPM Service (Custom Illuminate micro-framework)
  # ----------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: bestofxyz_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_PATH: /var/www/html/
      DB_HOST: ${DB_HOST:-db}
      REDIS_HOST: ${REDIS_HOST:-redis}
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------
  # Web Server (Nginx)
  # ----------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    container_name: bestofxyz_web
    restart: unless-stopped
    ports:
      - "${FORWARD_HTTP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend-network
    depends_on:
      - app

  # ----------------------------------------------------------------------
  # Database (MariaDB 11.4 LTS)
  # ----------------------------------------------------------------------
  db:
    image: mariadb:11.4
    container_name: bestofxyz_db
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-bestofxyz}
      MARIADB_USER: ${DB_USERNAME:-bestofxyz_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      # Bound to 127.0.0.1; defaults to 3308 to avoid host MySQL/MariaDB collisions
      - "127.0.0.1:${FORWARD_DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------
  # Database Admin (phpMyAdmin)
  # ----------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bestofxyz_pma
    restart: unless-stopped
    ports:
      # Defaults to 8082 to avoid collisions with existing local containers/services
      - "127.0.0.1:${FORWARD_PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      UPLOAD_LIMIT: 128M
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------
  # Cache & Session Store (Redis)
  # ----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bestofxyz_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Bound to 127.0.0.1; defaults to 6380 to avoid host Redis collisions
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------
  # Frontend Asset Builder / Watcher (Vite 6 + React 19)
  # ----------------------------------------------------------------------
  node:
    image: node:22-bookworm-slim
    container_name: bestofxyz_node
    restart: unless-stopped
    user: "node"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - NODE_ENV=development
    command: ["npm", "run", "watch"]
    networks:
      - backend-network

# ------------------------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  backend-network:
    driver: bridge
